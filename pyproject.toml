[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "article-pipeline"
version = "0.3.0"
description = "From keywords to WordPress posts — research, write, review, revise, publish"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "ddgs>=0.1",
    "jinja2>=3.1",
    "markdown>=3.4",
    "nh3>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
article-pipeline = "article_pipeline.pipeline:main"
ap = "article_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["article_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
