[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "article-pipeline"
version = "0.3.0"
description = "From keywords to WordPress posts — research, write, review, revise, publish"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "ddgs>=0.1",
    "jinja2>=3.1",
    "markdown>=3.4",
    "nh3>=0.3",
    # Hard runtime dependency of article_pipeline.converter (bs4 import at
    # module level). It was missing here, which made `tests/` fail at
    # COLLECTION time on a clean install — i.e. the whole suite was skipped,
    # not just the converter tests.
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
article-pipeline = "article_pipeline.pipeline:main"
ap = "article_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["article_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests doing live DDG/MCP/SSH/LLM I/O are opt-in: `pytest -m network`.
# Before this, two such tests made a bare `pytest tests` hang forever, so the
# suite was effectively unrunnable and nobody saw its results.
addopts = "-m 'not network'"
markers = [
    "network: hits live external services (DDG, MCP, SSH, LLM APIs); deselected by default",
]
