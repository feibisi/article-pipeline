rules:
  - "标题包含核心事实（谁做了什么/发生了什么），避免点击诱导"
  - "第一段涵盖5W：谁、什么事、什么时候、在哪、为什么重要"
  - "正文按重要性递减排列细节，避免按时间线。最重要的细节在前300字"
  - "引用来源和官方声明原文。转述不如直接引用"

common_rules:
  - "写作姿态：像跟你最聪明但没耐心的朋友解释一件事。他知道你什么意思所以不铺垫。不需要文采，需要精准。写到一半有三段说同一件事，删两段"
  - "全篇破折号不超过3个。能用句号的地方用句号，解释说明用冒号，转折用逗号。写完后数一遍，超过3个就把多余的删掉"
  - "一句话一个意思。不用从句嵌套。每段不超过3句话，超过就拆"
  - "数据后面必须跟一句解释，说明这个数字意味着什么"
  - "产品发布和营销类文章严禁编造假设场景，只写素材中确认的事实"
  - "素材中未确认的数据、数字、时间、URL、地址、流程细节，直接跳过不写"
  - "不用'赋能''闭环''抓手''天花板''底层逻辑'等管理黑话"
  - "段落之间不用'此外''另外''与此同时'衔接，让内容自然过渡"
  - "产品发布和营销类文章不要插入Mermaid图"
